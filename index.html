<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Skill-Based Internship Matcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Internship & Project Matching Platform</h1>
    
    <section class="input-section">
      <h2>Project Requirements</h2>
      <textarea id="projectRequirements" placeholder="Enter requirements in format: skill (critical/optional/bonus/preferred)"></textarea>
      
      <h2>Project Metadata</h2>
      <input type="text" id="projectDomain" placeholder="Domain (e.g., AI, Web, Mobile)">
      <input type="text" id="projectDifficulty" placeholder="Difficulty (easy/medium/hard)">
      
      <h2>Candidates</h2>
      <textarea id="candidates" placeholder="Enter candidates in format: Name: skill1(years), skill2(years), softskill1"></textarea>
      
      <button onclick="matchCandidates()">Generate Rankings</button>
    </section>
    
    <section class="output-section">
      <h2>Results</h2>
      <div id="results"></div>
    </section>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
